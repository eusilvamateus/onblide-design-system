<!doctype html>
<!-- @dsCard group="UI Kit — Web App" name="Web App UI Kit" subtitle="Dashboard click-through — componentes integrados nativamente nas telas (Home, Tarefas, Métricas, Ajustes)" viewport="1280x720" -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Onblide · Web App UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css"/>
  <!-- Phosphor Icons — official web font (regular weight) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"/>
  <style>
    html, body { margin: 0; padding: 0; background: var(--ob-bg); height: 100%; overflow: hidden; transition: background 200ms; }
    #app { display: flex; height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .scroll { flex: 1; overflow: auto; background: var(--ob-bg); }
  </style>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#0a4ee4">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#0a4ee4"/>
      <rect x="60" y="60" width="240" height="680" rx="20" fill="#fff" opacity="0.2"/>
      <rect x="120" y="120" width="120" height="120" rx="12" fill="#eb7c2d" opacity="0.9"/>
      <text x="600" y="400" font-family="system-ui" font-size="96" font-weight="700" fill="#fff" text-anchor="middle">Onblide</text>
    </svg>
  </template>

  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../package/dist/onblide-ui.browser.js"></script>

  <script type="text/babel" src="Chrome.jsx"></script>
  <script type="text/babel" src="Screens.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">

const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "colorMode": "calm",
  "density": "comfortable"
}/*EDITMODE-END*/;

const App = () => {
  const [route, setRoute] = useState('home');
  const [tweaks, setTweaks] = useTweaks(TWEAK_DEFAULTS);
  const [editMode, setEditMode] = useState(false);

  useEffect(() => {
    const handleMessage = (e) => {
      if (e.data && e.data.type === '__activate_edit_mode') {
        setEditMode(true);
      }
      if (e.data && e.data.type === '__deactivate_edit_mode') {
        setEditMode(false);
      }
    };
    window.addEventListener('message', handleMessage);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handleMessage);
  }, [setEditMode]);

  // Color palettes per mode
  const palettes = {
    vibrant: { primary: '#0a4ee4', accent: '#eb7c2d', surface: '#fff', bg2: '#fbfbfb' },
    calm: { primary: '#2a6fdb', accent: '#6b9e3d', surface: '#faf9f5', bg2: '#f5f3ef' },
    bold: { primary: '#0840b8', accent: '#d97757', surface: '#fff', bg2: '#fafafa' }
  };
  const palette = palettes[tweaks.colorMode];

  // Density: padding & gaps
  const densities = {
    cozy: { pad: 48, gap: 18, cardPad: 24, sidebarWidth: 260 },
    comfortable: { pad: 32, gap: 14, cardPad: 20, sidebarWidth: 240 },
    compact: { pad: 20, gap: 10, cardPad: 14, sidebarWidth: 200 }
  };
  const density = densities[tweaks.density];

  const titles = { home: 'Início', tasks: 'Tarefas', metrics: 'Métricas', integrations: 'Integrações', settings: 'Ajustes',
    docs: 'Documentos', agenda: 'Agenda', help: 'Ajuda' };
  const screens = {
    home: <HomeScreen />, tasks: <TasksScreen />, metrics: <MetricsScreen />, integrations: <IntegrationsScreen />, settings: <SettingsScreen />
  };
  const screen = screens[route] ||
  <div style={{ padding: density.pad, color: '#7a7a7a' }}>
          <h2 style={{ color: "rgb(245, 245, 245)" }}>Em construção</h2>
          <p>Esta tela ainda não está incluída no UI kit.</p>
        </div>;

  const action = (route === 'home' || route === 'integrations') ? null :
  <Button kind="primary" icon={<Icons.plus size={16} />}>Novo</Button>;


  useEffect(() => {
    // Apply theme via data-theme attribute (CSS handles the inversion)
    document.documentElement.setAttribute('data-theme', tweaks.theme);
  }, [tweaks.theme]);

  useEffect(() => {
    // Only apply color-mode tints in light theme — dark theme uses its own tokens
    if (tweaks.theme === 'dark') {
      ['--ob-blue', '--ob-blue-700', '--ob-orange'].forEach((p) =>
      document.documentElement.style.removeProperty(p)
      );
      return;
    }
    document.documentElement.style.setProperty('--ob-blue', palette.primary);
    document.documentElement.style.setProperty('--ob-blue-700', palette.primary === 'var(--ob-blue)' ? 'var(--ob-blue-700)' : palette.primary === '#2a6fdb' ? '#1d5bb8' : '#0633a0');
    document.documentElement.style.setProperty('--ob-orange', palette.accent);
    // Don't touch --ob-surface / --ob-surface-2 — those must follow theme
  }, [palette, tweaks.theme]);

  useEffect(() => {
    document.documentElement.style.setProperty('--sidebar-width', density.sidebarWidth + 'px');
    document.documentElement.style.setProperty('--pad', density.pad + 'px');
    document.documentElement.style.setProperty('--gap', density.gap + 'px');
    const scrollEls = document.querySelectorAll('.scroll');
    scrollEls.forEach((el) => el.style.padding = density.pad + 'px');
  }, [density]);

  return (
    <>
          <ToastStack />
          <style>{`
            main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
            .scroll { flex: 1; overflow: auto; }
          `}</style>
          <Sidebar active={route} onNav={setRoute} />
          <main>
            <Topbar title={titles[route] || route} action={action} />
            <div className="scroll">{screen}</div>
          </main>
          {editMode &&
      <TweaksPanel>
              <TweakSection title="Theme">
                <TweakRadio
            options={['light', 'dark']}
            value={tweaks.theme}
            onChange={(v) => setTweaks('theme', v)} />
          
              </TweakSection>
              <TweakSection title="Color mode">
                <TweakRadio
            options={['vibrant', 'calm', 'bold']}
            value={tweaks.colorMode}
            onChange={(v) => setTweaks('colorMode', v)} />
          
              </TweakSection>
              <TweakSection title="Density">
                <TweakRadio
            options={['cozy', 'comfortable', 'compact']}
            value={tweaks.density}
            onChange={(v) => setTweaks('density', v)} />
          
              </TweakSection>
            </TweaksPanel>
      }
        </>);

};
ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
