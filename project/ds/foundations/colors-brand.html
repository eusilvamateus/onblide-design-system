<!doctype html>
<html><head><meta charset="utf-8"><title>Brand colors</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .swatch { border-radius: var(--ob-r-md); padding: 16px; height: 132px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--ob-shadow-xs); }
  .name { font-weight: 600; font-size: 14px; }
  .hex { font-family: var(--ob-font-mono); font-size: 12px; opacity: 0.85; letter-spacing: 0.02em; }
  .role { font-size: 11px; opacity: 0.85; line-height: 1.3; }
</style></head><body>
  <div class="row">
    <div class="swatch" style="background: #0a4ee4; color: #fff;">
      <div><div class="name">Blue</div><div class="role">Primary · CTAs · attention</div></div>
      <div class="hex">#0A4EE4</div>
    </div>
    <div class="swatch" style="background: #779e3d; color: #fff;">
      <div><div class="name">Green</div><div class="role">Success · positive states</div></div>
      <div class="hex">#779E3D</div>
    </div>
    <div class="swatch" style="background: #eb7c2d; color: #fff;">
      <div><div class="name">Orange</div><div class="role">Warning · accent</div></div>
      <div class="hex">#EB7C2D</div>
    </div>
    <div class="swatch" style="background: #545454; color: #fff;">
      <div><div class="name">Ink</div><div class="role">Body text · neutral foreground</div></div>
      <div class="hex">#545454</div>
    </div>
    <div class="swatch" style="background: #f2f0e8; color: #545454; border: 1px solid #ececec;">
      <div><div class="name">Cream</div><div class="role">Warm overlay on white</div></div>
      <div class="hex">#F2F0E8</div>
    </div>
  </div>
</body></html>
