<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ob-font); color: #545454; }
  .row { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
  .tok { font-family: var(--ob-font-mono); font-size: 11px; color: #2a2a2a; width: 64px; flex: none; }
  .px { font-family: var(--ob-font-mono); font-size: 11px; color: #a8a8a8; width: 50px; flex: none; }
  .bar { height: 14px; background: #0a4ee4; border-radius: 4px; }
</style></head><body>
  <div class="row"><div class="tok">--ob-s-1</div><div class="px">4px</div><div class="bar" style="width:4px;"></div></div>
  <div class="row"><div class="tok">--ob-s-2</div><div class="px">8px</div><div class="bar" style="width:8px;"></div></div>
  <div class="row"><div class="tok">--ob-s-3</div><div class="px">12px</div><div class="bar" style="width:12px;"></div></div>
  <div class="row"><div class="tok">--ob-s-4</div><div class="px">16px</div><div class="bar" style="width:16px;"></div></div>
  <div class="row"><div class="tok">--ob-s-5</div><div class="px">24px</div><div class="bar" style="width:24px;"></div></div>
  <div class="row"><div class="tok">--ob-s-6</div><div class="px">32px</div><div class="bar" style="width:32px;"></div></div>
  <div class="row"><div class="tok">--ob-s-7</div><div class="px">48px</div><div class="bar" style="width:48px;"></div></div>
  <div class="row"><div class="tok">--ob-s-8</div><div class="px">64px</div><div class="bar" style="width:64px;"></div></div>
  <div class="row"><div class="tok">--ob-s-9</div><div class="px">96px</div><div class="bar" style="width:96px;"></div></div>
</body></html>
