<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fbfbfb; font-family: var(--ob-font); color: #545454; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 90px; height: 70px; background: #fff; border-radius: 12px; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: #2a2a2a; }
</style></head><body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow: 0 1px 2px rgba(20,20,20,0.04);"></div><div class="lbl">shadow-xs</div></div>
    <div class="item"><div class="box" style="box-shadow: 0 1px 3px rgba(20,20,20,0.05), 0 1px 2px rgba(20,20,20,0.03);"></div><div class="lbl">shadow-sm</div></div>
    <div class="item"><div class="box" style="box-shadow: 0 4px 12px rgba(20,20,20,0.06), 0 1px 3px rgba(20,20,20,0.04);"></div><div class="lbl">shadow-md</div></div>
    <div class="item"><div class="box" style="box-shadow: 0 12px 28px rgba(20,20,20,0.08), 0 4px 8px rgba(20,20,20,0.04);"></div><div class="lbl">shadow-lg</div></div>
    <div class="item"><div class="box" style="box-shadow: 0 8px 24px rgba(10,78,228,0.28); background:#0a4ee4;"></div><div class="lbl">shadow-pop</div></div>
  </div>
</body></html>
