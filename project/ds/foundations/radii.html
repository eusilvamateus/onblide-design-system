<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ob-font); color: #545454; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 80px; height: 80px; background: #f2f0e8; border: 1px solid #ececec; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: #2a2a2a; }
  .px { font-size: 11px; color: #a8a8a8; }
</style></head><body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px;"></div><div class="lbl">r-xs</div><div class="px">4px</div></div>
    <div class="item"><div class="box" style="border-radius:8px;"></div><div class="lbl">r-sm</div><div class="px">8px</div></div>
    <div class="item"><div class="box" style="border-radius:12px;"></div><div class="lbl">r-md</div><div class="px">12px</div></div>
    <div class="item"><div class="box" style="border-radius:16px;"></div><div class="lbl">r-lg</div><div class="px">16px</div></div>
    <div class="item"><div class="box" style="border-radius:20px;"></div><div class="lbl">r-xl</div><div class="px">20px</div></div>
    <div class="item"><div class="box" style="border-radius:999px;"></div><div class="lbl">r-pill</div><div class="px">999</div></div>
  </div>
</body></html>
