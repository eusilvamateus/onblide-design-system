<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ob-font); display: flex; align-items: center; justify-content: space-around; }
  .mark { display: flex; align-items: center; gap: 10px; }
  .glyph { width: 36px; height: 36px; border-radius: 10px; background: #0a4ee4; position: relative; display: flex; align-items: center; justify-content: center; }
  .glyph::before { content:""; position: absolute; width: 14px; height: 14px; background: #f2f0e8; border-radius: 4px; transform: translate(-4px, -4px); }
  .glyph::after { content:""; position: absolute; width: 14px; height: 14px; background: #eb7c2d; border-radius: 50%; transform: translate(5px, 5px); }
  .word { font-weight: 800; font-size: 26px; letter-spacing: -0.03em; color: #2a2a2a; }
  .word em { font-style: normal; color: #0a4ee4; }
  .small { transform: scale(0.7); transform-origin: left; }
  .reverse { background: #2a2a2a; padding: 14px 18px; border-radius: 12px; }
  .reverse .word { color: #fff; }
  .reverse .word em { color: #eb7c2d; }
</style></head><body>
  <div class="mark"><div class="glyph"></div><div class="word">on<em>blide</em></div></div>
  <div class="mark reverse"><div class="glyph" style="background:#0a4ee4;"></div><div class="word">on<em>blide</em></div></div>
  <div class="mark"><div class="glyph" style="background:#eb7c2d;"></div><div class="word">on<em>blide</em></div></div>
</body></html>
