<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic colors</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .stack { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .alert { border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; font-size: 13px; line-height: 1.4; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
  .alert b { display: block; font-weight: 600; margin-bottom: 2px; font-size: 13px; }
  .alert span { color: #545454; }
</style></head><body>
  <div class="stack">
    <div class="alert" style="background:#ecf3da;">
      <div class="dot" style="background:#779e3d;"></div>
      <div><b style="color:#5f7f30;">Success</b><span>Salvo com sucesso.</span></div>
    </div>
    <div class="alert" style="background:#fde6d3;">
      <div class="dot" style="background:#eb7c2d;"></div>
      <div><b style="color:#c46220;">Warning</b><span>Verifique antes de continuar.</span></div>
    </div>
    <div class="alert" style="background:#fde2e2;">
      <div class="dot" style="background:#d23838;"></div>
      <div><b style="color:#a72424;">Danger</b><span>Algo deu errado.</span></div>
    </div>
  </div>
</body></html>
