<!doctype html>
<!-- @dsCard group="Brand" name="Brand — Shapes" subtitle="Formas geométricas para ilustrações" viewport="760x160" -->
<html><head><meta charset="utf-8"><title>Geometric shapes</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ob-font); color: #545454; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .shape { width: 70px; height: 70px; }
  .lbl { font-size: 11px; color: #7a7a7a; }
  .circle { background: #0a4ee4; border-radius: 50%; }
  .square { background: #eb7c2d; border-radius: 12px; }
  .pill { background: #779e3d; border-radius: 999px; height: 30px; width: 70px; margin-top: 20px; }
  .triangle { width: 0; height: 0; border-left: 35px solid transparent; border-right: 35px solid transparent; border-bottom: 60px solid #2a2a2a; margin-top: 5px; }
  .arc { width: 70px; height: 70px; border-radius: 50%; background: conic-gradient(#0a4ee4 0deg 200deg, #f2f0e8 200deg 360deg); }
  .symbol { display: flex; align-items: center; justify-content: center; }
  .symbol img { width: 66px; height: auto; }
</style></head><body>
  <div class="row">
    <div class="item"><div class="shape circle"></div><div class="lbl">Circle</div></div>
    <div class="item"><div class="shape square"></div><div class="lbl">Soft square</div></div>
    <div class="item"><div class="shape pill"></div><div class="lbl">Pill</div></div>
    <div class="item"><div class="shape triangle"></div><div class="lbl">Triangle</div></div>
    <div class="item"><div class="shape arc"></div><div class="lbl">Arc</div></div>
    <div class="item"><div class="shape symbol"><img src="../../assets/onblide-symbol-primary.svg" alt="Símbolo Onblide"></div><div class="lbl">Symbol</div></div>
  </div>
</body></html>
