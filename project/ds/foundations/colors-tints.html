<!doctype html>
<html><head><meta charset="utf-8"><title>Color tints</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ob-font); }
  .grid { display: grid; grid-template-columns: 80px repeat(4, 1fr); gap: 6px; align-items: center; }
  .label { font-size: 13px; font-weight: 600; color: #2a2a2a; }
  .sw { height: 56px; border-radius: 8px; display: flex; align-items: flex-end; padding: 6px 8px; font-family: var(--ob-font-mono); font-size: 10px; }
  .head { font-size: 11px; color: #7a7a7a; font-weight: 500; text-align: center; }
</style></head><body>
  <div class="grid">
    <div></div>
    <div class="head">050</div><div class="head">100</div><div class="head">base</div><div class="head">700</div>

    <div class="label">Blue</div>
    <div class="sw" style="background:#f1f5ff; color:#0840b8;">#F1F5FF</div>
    <div class="sw" style="background:#e0eaff; color:#0840b8;">#E0EAFF</div>
    <div class="sw" style="background:#0a4ee4; color:#fff;">#0A4EE4</div>
    <div class="sw" style="background:#0840b8; color:#fff;">#0840B8</div>

    <div class="label">Green</div>
    <div class="sw" style="background:#f5fae8; color:#5f7f30; border:1px solid #ececec;">#F5FAE8</div>
    <div class="sw" style="background:#ecf3da; color:#5f7f30;">#ECF3DA</div>
    <div class="sw" style="background:#779e3d; color:#fff;">#779E3D</div>
    <div class="sw" style="background:#5f7f30; color:#fff;">#5F7F30</div>

    <div class="label">Orange</div>
    <div class="sw" style="background:#fef3e9; color:#c46220; border:1px solid #ececec;">#FEF3E9</div>
    <div class="sw" style="background:#fde6d3; color:#c46220;">#FDE6D3</div>
    <div class="sw" style="background:#eb7c2d; color:#fff;">#EB7C2D</div>
    <div class="sw" style="background:#c46220; color:#fff;">#C46220</div>
  </div>
</body></html>
