<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .sw { border-radius: var(--ob-r-sm); height: 80px; display: flex; align-items: flex-end; padding: 8px; font-family: var(--ob-font-mono); font-size: 10px; }
  .lbl { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; margin-top: 8px; color: var(--ob-fg-soft); }
  .lbl b { color: var(--ob-fg-strong); font-weight: 600; }
  .col { }
</style></head><body>
  <div class="row">
    <div class="col"><div class="sw" style="background:#2a2a2a; color:#fff;">#2A2A2A</div><div class="lbl"><b>ink-strong</b></div></div>
    <div class="col"><div class="sw" style="background:#545454; color:#fff;">#545454</div><div class="lbl"><b>ink</b></div></div>
    <div class="col"><div class="sw" style="background:#7a7a7a; color:#fff;">#7A7A7A</div><div class="lbl"><b>ink-soft</b></div></div>
    <div class="col"><div class="sw" style="background:#a8a8a8; color:#fff;">#A8A8A8</div><div class="lbl"><b>ink-mute</b></div></div>
    <div class="col"><div class="sw" style="background:#ececec; color:#545454;">#ECECEC</div><div class="lbl"><b>line</b></div></div>
    <div class="col"><div class="sw" style="background:#fbfbfb; color:#545454; border:1px solid #ececec;">#FBFBFB</div><div class="lbl"><b>surface-2</b></div></div>
    <div class="col"><div class="sw" style="background:#ffffff; color:#545454; border:1px solid #ececec;">#FFFFFF</div><div class="lbl"><b>surface</b></div></div>
  </div>
</body></html>
