<!-- @dsCard group="Components" name="Link" subtitle="Variants default/subtle/quiet/external + inline" viewport="760x200" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Link</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .grid { display: grid; gap: 22px; grid-template-columns: 90px 1fr; align-items: center; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); }
  .row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .prose { font-size: 14px; line-height: 1.7; color: var(--ob-fg); max-width: 460px; }
</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../package/dist/onblide-ui.browser.js"></script>
  <script type="text/babel">
    function Demo() {
      return (
        <div className="grid">
          <div className="lbl">VARIANTS</div>
          <div className="row">
            <Link href="#" onClick={(e)=>e.preventDefault()}>Link padrão</Link>
            <Link href="#" variant="subtle" onClick={(e)=>e.preventDefault()}>Subtle</Link>
            <Link href="#" variant="quiet" onClick={(e)=>e.preventDefault()}>Quiet</Link>
            <Link href="#" external onClick={(e)=>e.preventDefault()}>Externo</Link>
          </div>
          <div className="lbl">INLINE</div>
          <p className="prose">
            A Onblide constrói soluções online — veja a <Link href="#" onClick={(e)=>e.preventDefault()}>documentação</Link> ou
            explore o <Link href="#" external onClick={(e)=>e.preventDefault()}>repositório público</Link> pra começar.
          </p>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body></html>
