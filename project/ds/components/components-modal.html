<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Modal</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); min-height: 280px; }
  .grid { display: grid; gap: 24px; grid-template-columns: 90px 1fr; align-items: center; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-family: var(--ob-font); font-size: 14px; font-weight: 600; }
  .btn-primary { background: var(--ob-blue); color: #fff; }
  .btn-secondary { background: var(--ob-surface); color: var(--ob-fg-strong); border: 1.5px solid var(--ob-border); }
  .btn-danger { background: var(--ob-danger); color: #fff; }
</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../../ui_kits/web_app/Components.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    function Demo() {
      const [info, setInfo] = useState(false);
      const [confirm, setConfirm] = useState(false);
      return (
        <div className="grid">
          <div className="lbl">TRIGGERS</div>
          <div className="row">
            <button className="btn btn-secondary" onClick={() => setInfo(true)}>Abrir info</button>
            <button className="btn btn-danger" onClick={() => setConfirm(true)}>Excluir projeto</button>
          </div>

          <Modal open={info} onClose={() => setInfo(false)} title="Sobre o workspace"
            footer={<button className="btn btn-primary" onClick={() => setInfo(false)}>Entendi</button>}>
            Este workspace reúne todos os seus projetos da Onblide. Você pode convidar
            colaboradores, definir papéis e acompanhar o progresso em um só lugar.
          </Modal>

          <Modal open={confirm} onClose={() => setConfirm(false)} title="Excluir projeto?"
            footer={<>
              <button className="btn btn-secondary" onClick={() => setConfirm(false)}>Cancelar</button>
              <button className="btn btn-danger" onClick={() => setConfirm(false)}>Excluir</button>
            </>}>
            Esta ação é permanente. Todos os dados do projeto serão removidos e não poderão
            ser recuperados. Tem certeza?
          </Modal>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body></html>
