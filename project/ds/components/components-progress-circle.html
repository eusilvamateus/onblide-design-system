<!-- @dsCard group="Components" name="ProgressCircle" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>ProgressCircle</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .wrap { display: grid; grid-template-columns: 260px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 680px) { .wrap { grid-template-columns: 1fr; } }
  .panel { display: flex; flex-direction: column; gap: 20px; }
  .ctrl { display: flex; flex-direction: column; gap: 9px; }
  .ctrl > .head { font-family: var(--ob-font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ob-fg-mute); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .stage { background: var(--ob-bg-warm); border-radius: var(--ob-r-surface); border: 1.5px dashed var(--ob-border); padding: 32px 28px; display: flex; flex-direction: column; gap: 32px; }
  .row-label { font-family: var(--ob-font-mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ob-fg-mute); margin-bottom: 16px; }
  .flex-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .metric-card { background: var(--ob-surface); border: 1px solid var(--ob-border); border-radius: var(--ob-r-surface); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 100px; }
  .metric-label { font-size: 12px; font-weight: 600; color: var(--ob-fg-soft); }
  .range-row { display: flex; align-items: center; gap: 14px; }
  .range-row label { font-size: 13px; color: var(--ob-fg-soft); min-width: 48px; font-family: var(--ob-font-mono); }
  .range-row input[type=range] { flex: 1; accent-color: var(--ob-blue); }
  .val-badge { font-size: 13px; font-weight: 700; font-family: var(--ob-font-mono); color: var(--ob-fg-strong); min-width: 36px; text-align: right; }
</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.Icons=window.Icons||{};</script>
<script src="../../package/dist/onblide-ui.browser.js"></script>
<script type="text/babel" src="../../ui_kits/web_app/Components.jsx"></script>
<script type="text/babel">
const { useState } = React;
const TONES = ['default','success','warning','danger'];
const SIZES = ['sm','md','lg','xl'];

function Demo() {
  const [tone,      setTone]      = useState('default');
  const [size,      setSize]      = useState('md');
  const [showLabel, setShowLabel] = useState(true);
  const [value,     setValue]     = useState(67);
  // Independent values for the metrics row
  const [sessions,  setSessions]  = useState(72);
  const [revenue,   setRevenue]   = useState(48);
  const [tasks,     setTasks]     = useState(91);

  const autoTone = (v) => v >= 80 ? 'success' : v >= 50 ? 'default' : v >= 30 ? 'warning' : 'danger';

  return (
    <div className="wrap">
      <div className="panel">
        <div className="ctrl">
          <span className="head">Valor</span>
          <div className="range-row">
            <label>{value}%</label>
            <input type="range" min={0} max={100} value={value} onChange={e=>setValue(+e.target.value)} />
          </div>
        </div>
        <div className="ctrl">
          <span className="head">Tom</span>
          <div className="chip-row">
            {TONES.map(t => <Chip key={t} label={t} size="sm" selected={tone===t} onToggle={()=>setTone(t)} />)}
          </div>
        </div>
        <div className="ctrl">
          <span className="head">Tamanho</span>
          <div className="chip-row">
            {SIZES.map(s => <Chip key={s} label={s} size="sm" selected={size===s} onToggle={()=>setSize(s)} />)}
          </div>
        </div>
        <div className="ctrl">
          <span className="head">Rótulo central</span>
          <Toggle checked={showLabel} onChange={setShowLabel} label={showLabel ? 'Visível' : 'Oculto'} />
        </div>
      </div>

      <div className="stage">
        <div>
          <p className="row-label">Interativo</p>
          <ProgressCircle value={value} size={size} tone={tone} showLabel={showLabel} />
        </div>

        <div>
          <p className="row-label">Todos os tamanhos · tom selecionado</p>
          <div className="flex-row">
            {SIZES.map(s => (
              <div key={s} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10}}>
                <ProgressCircle value={value} size={s} tone={tone} showLabel />
                <span style={{fontSize:10,fontFamily:'var(--ob-font-mono)',color:'var(--ob-fg-mute)'}}>{s}</span>
              </div>
            ))}
          </div>
        </div>

        <div>
          <p className="row-label">Tom automático por valor</p>
          <div className="flex-row">
            {[15, 40, 68, 93].map(v => (
              <div key={v} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
                <ProgressCircle value={v} size="md" tone={autoTone(v)} showLabel />
                <span style={{fontSize:10,fontFamily:'var(--ob-font-mono)',color:'var(--ob-fg-mute)'}}>{autoTone(v)}</span>
              </div>
            ))}
          </div>
        </div>

        <div>
          <p className="row-label">Em cards de métricas</p>
          <div className="flex-row">
            {[
              { label: 'Sessões', val: sessions, setVal: setSessions, tone: autoTone(sessions) },
              { label: 'Receita', val: revenue,  setVal: setRevenue,  tone: autoTone(revenue) },
              { label: 'Tarefas', val: tasks,    setVal: setTasks,    tone: autoTone(tasks) },
            ].map(m => (
              <div key={m.label} style={{display:'flex',flexDirection:'column',gap:12}}>
                <div className="metric-card">
                  <ProgressCircle value={m.val} size="lg" tone={m.tone} showLabel />
                  <span className="metric-label">{m.label}</span>
                </div>
                <div className="range-row">
                  <input type="range" min={0} max={100} value={m.val} onChange={e=>m.setVal(+e.target.value)} style={{width:100}} />
                  <span className="val-badge">{m.val}%</span>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div>
          <p className="row-label">Rótulo personalizado</p>
          <div className="flex-row">
            <ProgressCircle value={value} size="lg" tone={tone} showLabel label="Meta" />
            <ProgressCircle value={100}   size="lg" tone="success" showLabel label={<i className="ph ph-check" style={{fontSize:18}}/>} />
            <ProgressCircle value={0}     size="lg" tone="danger"  showLabel={false} />
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
