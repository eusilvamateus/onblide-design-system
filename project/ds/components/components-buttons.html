<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(2, max-content); align-items: center; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: var(--ob-r-control); border: none; cursor: pointer; transition: all 160ms cubic-bezier(0.2,0.7,0.2,1); }
  .btn-primary { background: var(--ob-blue); color: #fff; }
  .btn-primary:hover { background: var(--ob-blue-700); box-shadow: var(--ob-shadow-pop); }
  .btn-secondary { background: var(--ob-surface); color: var(--ob-fg-strong); border: 1.5px solid var(--ob-border); }
  .btn-secondary:hover { border-color: var(--ob-fg-soft); }
  .btn-ghost { background: transparent; color: var(--ob-blue); }
  .btn-ghost:hover { background: var(--ob-blue-100); }
  .btn-cream { background: var(--ob-bg-warm); color: var(--ob-fg-strong); }
  .btn-warning { background: var(--ob-warning); color: #fff; }
  .btn-success { background: var(--ob-success); color: #fff; }
  .group { display: flex; gap: 8px; align-items: center; }
</style></head><body>
  <div class="grid">
    <div class="lbl">PRIMARY</div>
    <div class="group">
      <button class="btn btn-primary">Continuar</button>
      <button class="btn btn-primary" style="padding:8px 14px; font-size:13px;">Compact</button>
      <button class="btn btn-primary" style="padding:14px 22px; font-size:15px;">Large action</button>
    </div>
    <div class="lbl">SECONDARY</div>
    <div class="group">
      <button class="btn btn-secondary">Cancelar</button>
      <button class="btn btn-ghost">Saiba mais →</button>
      <button class="btn btn-cream">Cream</button>
    </div>
    <div class="lbl">SEMANTIC</div>
    <div class="group">
      <button class="btn btn-success">Aprovar</button>
      <button class="btn btn-warning">Atenção</button>
      <button class="btn btn-secondary" disabled style="opacity:0.5; cursor:not-allowed;">Disabled</button>
    </div>
  </div>
</body></html>
