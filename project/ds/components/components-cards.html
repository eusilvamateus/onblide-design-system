<!-- @dsCard group="Components" name="Cards" subtitle="Bordered, elevated, warm cream" viewport="760x180" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../../package/src/tokens.css">
<style>
  body { margin: 0; padding: 24px; background: var(--ob-bg); font-family: var(--ob-font); color: var(--ob-fg-soft); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card { background: var(--ob-surface); border-radius: var(--ob-r-surface); padding: 16px; }
  .card.bordered { border: 1px solid var(--ob-border); }
  .card.shadowed { box-shadow: var(--ob-shadow-md); }
  .card.warm { background: var(--ob-bg-warm); }
  .title { font-weight: 600; color: var(--ob-fg-strong); margin: 0 0 4px; font-size: 16px; }
  .meta { font-size: 12px; color: var(--ob-fg-mute); }
  .num { font-size: 32px; font-weight: 700; color: var(--ob-fg-strong); letter-spacing: -0.02em; line-height: 1; margin-top: 6px; }
  .accent { width: 32px; height: 4px; background: var(--ob-blue); border-radius: 2px; margin-bottom: 12px; }
</style></head><body>
  <div class="row">
    <div class="card bordered">
      <div class="accent"></div>
      <div class="title">Bordered</div>
      <div class="meta">Hairline + soft radius</div>
      <div class="num">12.4k</div>
    </div>
    <div class="card shadowed">
      <div class="title">Elevated</div>
      <div class="meta">shadow-md, no border</div>
      <div class="num" style="color:var(--ob-blue);">+18%</div>
    </div>
    <div class="card warm">
      <div class="title">Warm overlay</div>
      <div class="meta">Cream on white</div>
      <div class="num" style="color:var(--ob-orange);">3.2x</div>
    </div>
  </div>
</body></html>
