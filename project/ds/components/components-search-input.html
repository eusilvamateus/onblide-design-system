<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Search Input</title>
<link rel="stylesheet" href="../../package/src/tokens.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .grid { display: grid; gap: 28px; grid-template-columns: 110px 1fr; align-items: start; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); padding-top: 12px; }
</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../package/dist/onblide-ui.browser.js"></script>
<script type="text/babel">
  const { useState } = React;
  const DATA = ['Painel de métricas', 'Integração Spotify', 'Tarefas atrasadas', 'Relatório de maio', 'Configurações de conta', 'Documentação da API'];
  function Demo() {
    const [q, setQ] = useState('');
    const [q2, setQ2] = useState('tare');
    const results = q2 ? DATA.filter(d => d.toLowerCase().includes(q2.toLowerCase())) : [];
    return (
      <div className="grid">
        <div className="lbl">PADRÃO</div>
        <SearchInput value={q} onChange={setQ} placeholder="Buscar no app…" />
        <div className="lbl">CARREGANDO</div>
        <SearchInput value="relatório" onChange={()=>{}} loading />
        <div className="lbl">COM RESULTADOS</div>
        <SearchInput value={q2} onChange={setQ2} results={results} placeholder="Buscar…" />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
