<!-- @dsCard group="Components" name="Table" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Table</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"/>
<style>
  body { margin: 0; padding: 32px; background: var(--ob-surface); font-family: var(--ob-font); }
  .grid { display: grid; gap: 40px; }
  .row-label { font-family: var(--ob-font-mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ob-fg-mute); margin-bottom: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../package/dist/onblide-ui.browser.js"></script>
<script type="text/babel">
const { useState } = React;

const TASKS = [
  { name: 'Mapa de jornada do usuário', status: 'done',       assignee: 'Ana Lima',      due: '28 mai',  priority: 'Alta' },
  { name: 'Wireframes do dashboard',    status: 'progress',   assignee: 'João Silva',    due: '02 jun',  priority: 'Alta' },
  { name: 'Auditoria de tipografia',    status: 'done',       assignee: 'Ana Lima',      due: '30 mai',  priority: 'Média' },
  { name: 'Componente Select',          status: 'progress',   assignee: 'Carla Souza',   due: '04 jun',  priority: 'Alta' },
  { name: 'Testes de usabilidade',      status: 'pending',    assignee: 'João Silva',    due: '10 jun',  priority: 'Média' },
  { name: 'Revisão com stakeholders',   status: 'pending',    assignee: 'Carla Souza',   due: '12 jun',  priority: 'Baixa' },
  { name: 'Entrega final',              status: 'pending',    assignee: 'Ana Lima',      due: '15 jun',  priority: 'Alta' },
];

const STATUS_MAP = { done: ['green', 'Concluído'], progress: ['blue', 'Em progresso'], pending: ['orange', 'Pendente'] };
const PRIORITY_COLORS = { Alta: 'red', Média: 'orange', Baixa: 'blue' };

const PAGES = [
  { page: '/', sessions: '4.820', time: '2:14', bounce: '32%', trend: '↑' },
  { page: '/pricing', sessions: '2.341', time: '3:40', bounce: '18%', trend: '↑' },
  { page: '/docs', sessions: '1.890', time: '4:52', bounce: '12%', trend: '↑' },
  { page: '/blog', sessions: '980', time: '1:30', bounce: '55%', trend: '↓' },
  { page: '/changelog', sessions: '412', time: '2:00', bounce: '38%', trend: '→' },
];

function Demo() {
  const [sort, setSort] = useState({ key: 'due', dir: 'asc' });
  const handleSort = (key) => setSort(s => ({ key, dir: s.key === key && s.dir === 'asc' ? 'desc' : 'asc' }));

  return (
    <div className="grid">

      {/* Selectable with badges */}
      <div>
        <div className="row-label">Selecionável · Status · Prioridade</div>
        <Table
          selectable
          sort={sort}
          onSort={handleSort}
          columns={[
            { key: 'name',     label: 'Tarefa',      bold: true },
            { key: 'status',   label: 'Status',      render: (v) => { const [t, l] = STATUS_MAP[v]; return <Badge tone={t}>{l}</Badge>; } },
            { key: 'priority', label: 'Prioridade',  render: (v) => <Badge tone={PRIORITY_COLORS[v]}>{v}</Badge> },
            { key: 'assignee', label: 'Responsável' },
            { key: 'due',      label: 'Prazo',       sortable: true, width: 90 },
          ]}
          rows={TASKS}
        />
      </div>

      {/* Simple sortable */}
      <div>
        <div className="row-label">Simples · Ordenável</div>
        <Table
          sort={sort}
          onSort={handleSort}
          columns={[
            { key: 'page',     label: 'Página',   bold: true },
            { key: 'sessions', label: 'Sessões',  sortable: true },
            { key: 'time',     label: 'Tempo médio' },
            { key: 'bounce',   label: 'Saída',    sortable: true },
            { key: 'trend',    label: 'Tendência', render: (v) => <span style={{ color: v === '↑' ? 'var(--ob-green)' : v === '↓' ? 'var(--ob-danger)' : 'var(--ob-fg-mute)', fontWeight: 700, fontSize: 16 }}>{v}</span> },
          ]}
          rows={PAGES}
        />
      </div>

      {/* Loading */}
      <div>
        <div className="row-label">Estado · Loading (skeleton)</div>
        <Table loading selectable
          columns={[
            { key: 'name',     label: 'Tarefa' },
            { key: 'status',   label: 'Status' },
            { key: 'assignee', label: 'Responsável' },
            { key: 'due',      label: 'Prazo' },
          ]}
          rows={[]}
        />
      </div>

      {/* Empty */}
      <div>
        <div className="row-label">Estado · Vazio</div>
        <Table
          columns={[
            { key: 'name',     label: 'Tarefa' },
            { key: 'status',   label: 'Status' },
            { key: 'assignee', label: 'Responsável' },
          ]}
          rows={[]}
          emptyState={<span>Nenhuma tarefa encontrada. <a href="#" style={{ color: 'var(--ob-blue)' }}>Criar tarefa</a></span>}
        />
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
