<!-- @dsCard group="Components" name="Side Navigation" viewport="760x600" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Side Navigation</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); margin: 0 0 12px; }
  .shell { display: grid; height: 540px; border: 1px solid var(--ob-border); border-radius: 14px; overflow: hidden; background: var(--ob-bg-alt); }
  .topbar { height: 60px; border-bottom: 1px solid var(--ob-border); background: var(--ob-surface); display: flex; align-items: center; padding: 0 22px; gap: 16px; font-size: 18px; font-weight: 700; color: var(--ob-fg-strong); letter-spacing: -0.02em; }
  .content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  .skel { height: 12px; border-radius: 6px; background: var(--ob-border); }
  .card { background: var(--ob-surface); border: 1px solid var(--ob-border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../package/dist/onblide-ui.browser.js"></script>
<script type="text/babel">
  const { useState } = React;
  const NAV_ITEMS = [
    { id: 'home',         label: 'Início',      icon: 'house' },
    { id: 'tasks',        label: 'Tarefas',     icon: 'kanban',      badge: 3 },
    { id: 'metrics',      label: 'Métricas',    icon: 'chart-line' },
    { id: 'integrations', label: 'Integrações', icon: 'squares-four' },
    { id: 'settings',     label: 'Ajustes',     icon: 'gear' },
  ];
  const Skel = ({ w }) => <div className="skel" style={{width: w || '100%'}} />;
  function Demo() {
    const [active, setActive] = useState('tasks');
    const [collapsed, setCollapsed] = useState(false);
    return (
      <div>
        <p className="lbl">ESCALA REAL · {collapsed ? 'colapsada' : 'expandida'} — use o botão no cabeçalho</p>
        <div className="shell" style={{ gridTemplateColumns: `${collapsed ? 72 : 240}px minmax(0,1fr)` }}>
          <SideNav items={NAV_ITEMS} active={active} onNav={setActive} collapsed={collapsed} onToggle={() => setCollapsed(c => !c)} flush />
          <div style={{display:'flex',flexDirection:'column',minWidth:0}}>
            <div className="topbar">Tarefas</div>
            <div className="content">
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
                {[0,1,2].map(i=><div key={i} className="card"><Skel w="60%"/><Skel/><Skel w="80%"/></div>)}
              </div>
              <div className="card"><Skel w="40%"/><Skel/><Skel w="70%"/><Skel w="55%"/></div>
            </div>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
