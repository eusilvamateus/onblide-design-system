<!-- @dsCard group="Components" name="Skeleton" subtitle="Linhas, círculo e card de loading com shimmer" viewport="760x320" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Skeleton</title>
<link rel="stylesheet" href="../../package/src/tokens.css">
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .grid { display: grid; gap: 22px; grid-template-columns: 90px 1fr; align-items: start; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); padding-top: 2px; }
  .card { width: 300px; border: 1px solid var(--ob-border); border-radius: 12px; padding: 16px; }
  .crow { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../package/dist/onblide-ui.browser.js"></script>
  <script type="text/babel">
    function Demo() {
      return (
        <div className="grid">
          <div className="lbl">SHAPES</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: 320 }}>
            <Skeleton width="60%" height={20} />
            <Skeleton width="100%" />
            <Skeleton width="90%" />
            <Skeleton width="40%" />
          </div>
          <div className="lbl">CARD</div>
          <div className="card">
            <div className="crow">
              <Skeleton height={40} circle />
              <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 8 }}>
                <Skeleton width="50%" height={14} />
                <Skeleton width="30%" height={12} />
              </div>
            </div>
            <Skeleton width="100%" height={88} radius={10} style={{ marginBottom: 12 }} />
            <Skeleton width="100%" />
            <div style={{ height: 8 }} />
            <Skeleton width="80%" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body></html>
