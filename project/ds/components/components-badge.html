<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Badge</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"/>
<style>
  body { margin: 0; padding: 32px; background: var(--ob-surface); font-family: var(--ob-font); }
  .section { margin-bottom: 32px; }
  .row-label { font-family: var(--ob-font-mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ob-fg-mute); margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
  .ctx { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: var(--ob-bg-alt); border: 1px solid var(--ob-border); border-radius: var(--ob-r-md); font-size: 14px; color: var(--ob-fg); }
  .divider { height: 1px; background: var(--ob-border); margin: 24px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const TONES = ['blue', 'green', 'orange', 'red', 'grey'];
const LABELS = { blue: 'Em foco', green: 'Ativo', orange: 'Pendente', red: 'Erro', grey: 'Rascunho' };

const Badge = ({ tone = 'blue', variant = 'subtle', dot = true, size = 'md', children }) => {
  const T = {
    blue:   { bg: 'var(--ob-blue-100)',  fg: 'var(--ob-blue-700)',  dot: 'var(--ob-blue)',    solid: 'var(--ob-blue)',    border: 'color-mix(in srgb, var(--ob-blue) 35%, transparent)' },
    green:  { bg: 'var(--ob-green-100)', fg: 'var(--ob-green-700)', dot: 'var(--ob-green)',   solid: 'var(--ob-green)',   border: 'color-mix(in srgb, var(--ob-green) 35%, transparent)' },
    orange: { bg: 'color-mix(in srgb, var(--ob-orange) 15%, var(--ob-surface))', fg: '#9a4000', dot: 'var(--ob-orange)', solid: 'var(--ob-orange)', border: 'color-mix(in srgb, var(--ob-orange) 45%, transparent)' },
    red:    { bg: 'var(--ob-danger-bg)', fg: 'var(--ob-danger)',    dot: 'var(--ob-danger)',  solid: 'var(--ob-danger)',  border: 'color-mix(in srgb, var(--ob-danger) 40%, transparent)' },
    grey:   { bg: 'var(--ob-bg-warm)',   fg: 'var(--ob-fg-soft)',   dot: 'var(--ob-fg-mute)', solid: 'var(--ob-fg-mute)', border: 'var(--ob-border)' },
  };
  const t = T[tone] || T.blue;
  const fs = size === 'sm' ? 11 : 12;
  const px = size === 'sm' ? '2px 8px' : '4px 10px';
  const styles = {
    subtle:  { background: t.bg, color: t.fg, border: 'none' },
    solid:   { background: t.solid, color: '#fff', border: 'none' },
    outline: { background: 'transparent', color: t.fg, border: `1.5px solid ${t.border}` },
    numeric: { background: t.solid, color: '#fff', border: 'none', minWidth: 18, height: 18, padding: '0 5px', justifyContent: 'center' },
  };
  const s = styles[variant] || styles.subtle;
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: variant === 'numeric' ? s.padding : px, borderRadius: 999, fontSize: fs, fontWeight: 700, lineHeight: 1, ...s }}>
      {variant !== 'numeric' && dot && <span style={{ width: 6, height: 6, borderRadius: '50%', background: variant === 'solid' ? 'rgba(255,255,255,0.7)' : t.dot, flexShrink: 0 }}/>}
      {children}
    </span>
  );
};

function Demo() {
  return (
    <div>
      {/* SUBTLE */}
      <div className="row-label">Subtle (padrão) · com ponto</div>
      <div className="row">
        {TONES.map(tone => <Badge key={tone} tone={tone}>{LABELS[tone]}</Badge>)}
      </div>

      {/* SUBTLE sem dot */}
      <div className="row-label">Subtle · sem ponto</div>
      <div className="row">
        {TONES.map(tone => <Badge key={tone} tone={tone} dot={false}>{LABELS[tone]}</Badge>)}
      </div>

      <div className="divider"/>

      {/* SOLID */}
      <div className="row-label">Solid</div>
      <div className="row">
        {TONES.map(tone => <Badge key={tone} tone={tone} variant="solid" dot={false}>{LABELS[tone]}</Badge>)}
      </div>

      {/* OUTLINE */}
      <div className="row-label">Outline</div>
      <div className="row">
        {TONES.map(tone => <Badge key={tone} tone={tone} variant="outline" dot={false}>{LABELS[tone]}</Badge>)}
      </div>

      <div className="divider"/>

      {/* NUMERIC */}
      <div className="row-label">Numeric · contagens e notificações</div>
      <div className="row">
        {['blue','green','orange','red','grey'].map((tone, i) => (
          <Badge key={tone} tone={tone} variant="numeric">{[3,12,99,1,'+'[0]][i] ?? i+1}</Badge>
        ))}
      </div>

      <div className="divider"/>

      {/* SIZES */}
      <div className="row-label">Tamanhos · sm e md</div>
      <div className="row" style={{ alignItems: 'center' }}>
        <Badge tone="blue" size="sm">sm · Ativo</Badge>
        <Badge tone="blue" size="md">md · Ativo</Badge>
        <Badge tone="green" variant="solid" size="sm">sm · Solid</Badge>
        <Badge tone="green" variant="solid" size="md">md · Solid</Badge>
        <Badge tone="blue" variant="numeric" size="sm">4</Badge>
        <Badge tone="blue" variant="numeric" size="md">4</Badge>
      </div>

      <div className="divider"/>

      {/* IN CONTEXT */}
      <div className="row-label">Em contexto</div>
      <div className="ctx">
        <i className="ph ph-circle" style={{ fontSize: 16, color: 'var(--ob-fg-mute)' }}/>
        Integração Spotify
        <Badge tone="green">Ativo</Badge>
      </div>
      <div style={{ height: 8 }}/>
      <div className="ctx">
        <i className="ph ph-circle" style={{ fontSize: 16, color: 'var(--ob-fg-mute)' }}/>
        Plano Pro
        <Badge tone="blue" variant="solid" dot={false}>Pro</Badge>
        <Badge tone="orange" variant="solid" dot={false}>Beta</Badge>
      </div>
      <div style={{ height: 8 }}/>
      <div className="ctx">
        Notificações
        <Badge tone="red" variant="numeric">3</Badge>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
