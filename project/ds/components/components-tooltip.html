<!-- @dsCard group="Components" name="Tooltip" subtitle="Imagem, texto complementar, versão invertida" viewport="760x220" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Tooltip</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 40px 24px; background: var(--ob-surface); font-family: var(--ob-font); min-height: 360px; }
  .grid { display: grid; gap: 40px; grid-template-columns: 90px 1fr; align-items: center; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); }
  .row { display: flex; gap: 36px; align-items: center; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--ob-border); background: var(--ob-surface); color: var(--ob-fg-strong); font-size: 14px; font-weight: 600; cursor: default; }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--ob-border); background: var(--ob-surface); color: var(--ob-fg-soft); display: inline-flex; align-items: center; justify-content: center; cursor: default; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--ob-orange); color: #fff; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; cursor: default; }
  .colored { background: var(--ob-blue); border-radius: 16px; padding: 24px 28px; display: inline-flex; gap: 20px; align-items: center; }
  .colored .pill { padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,0.18); color: #fff; font-size: 14px; font-weight: 600; cursor: default; }
  .hint { font-size: 12px; color: var(--ob-fg-mute); margin-top: 10px; }
</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../package/dist/onblide-ui.browser.js"></script>
  <script type="text/babel">
    const IMG = "data:image/svg+xml;utf8," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='120'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230a4ee4'/><stop offset='1' stop-color='%23eb7c2d'/></linearGradient></defs><rect width='200' height='120' fill='url(%23g)'/><circle cx='150' cy='30' r='40' fill='rgba(255,255,255,0.18)'/></svg>"
    );
    function Demo() {
      return (
        <div className="grid">
          <div className="lbl">IMAGEM</div>
          <div>
            <div className="row">
              <Tooltip variant="image" image={IMG} title="Onblide Dashboard" subtitle="Atualizado há 2h · v2.4">
                <span className="chip">Pré-visualizar produto</span>
              </Tooltip>
              <Tooltip variant="image" image={IMG} title="Marina Costa" subtitle="Designer · online">
                <span className="avatar">MC</span>
              </Tooltip>
            </div>
            <div className="hint">Passe o mouse — preview de produto ou usuário</div>
          </div>

          <div className="lbl">TEXTO</div>
          <div>
            <div className="row">
              <Tooltip label="Salvar alterações" shortcut="⌘S">
                <span className="icon-btn">
                  <svg width="18" height="18" viewBox="0 0 256 256" fill="none" stroke="currentColor" strokeWidth="16" strokeLinecap="round" strokeLinejoin="round"><path d="M40 128l56 56 120-120"/></svg>
                </span>
              </Tooltip>
              <Tooltip label="Criada em 24/05/2026, 14:32" placement="bottom">
                <span className="chip">Hora de criação</span>
              </Tooltip>
              <Tooltip label="Buscar" shortcut="/" placement="right">
                <span className="icon-btn">
                  <svg width="18" height="18" viewBox="0 0 256 256" fill="none" stroke="currentColor" strokeWidth="16" strokeLinecap="round" strokeLinejoin="round"><circle cx="116" cy="116" r="76"/><path d="m172 172 44 44"/></svg>
                </span>
              </Tooltip>
            </div>
            <div className="hint">Informação complementar — hora, atalhos</div>
          </div>

          <div className="lbl">INVERTIDA</div>
          <div>
            <div className="colored">
              <Tooltip variant="inverted" label="Em fundo colorido ganha destaque" placement="top">
                <span className="pill">Hover aqui</span>
              </Tooltip>
              <Tooltip variant="inverted" label="Atalho rápido" shortcut="⌘K" placement="bottom">
                <span className="pill">Com atalho</span>
              </Tooltip>
            </div>
            <div className="hint">Superfície clara — destaque sobre cores da marca</div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body></html>
