<!-- @dsCard group="Components" name="Progress Bar" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Progress Bar</title>
<link rel="stylesheet" href="../../package/src/tokens.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .grid { display: grid; gap: 22px; grid-template-columns: 120px 1fr; align-items: center; max-width: 600px; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); }
  .row { display: flex; gap: 14px; align-items: center; }
  .btn { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1.5px solid var(--ob-border); background: var(--ob-surface); color: var(--ob-fg); font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--ob-blue); border-color: var(--ob-blue); color: #fff; }
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/thin/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/duotone/style.css">
</head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../package/dist/onblide-ui.browser.js"></script>
<script type="text/babel">
  const { useState, useEffect } = React;
  function Demo() {
    const [v, setV] = useState(40);
    const [auto, setAuto] = useState(0);
    useEffect(() => { const id = setInterval(() => setAuto(a => a >= 100 ? 0 : a + 5), 400); return () => clearInterval(id); }, []);
    return (
      <div className="grid">
        <div className="lbl">DETERMINADA</div>
        <div>
          <ProgressBar value={v} tone="primary" showLabel />
          <div className="row" style={{marginTop:10}}>
            <button className="btn" onClick={()=>setV(x=>Math.max(0,x-10))}>−10</button>
            <button className="btn" onClick={()=>setV(x=>Math.min(100,x+10))}>+10</button>
            <button className="btn primary" onClick={()=>setV(100)}>Completar</button>
          </div>
        </div>
        <div className="lbl">SUCESSO · AUTO</div>
        <ProgressBar value={auto} tone="success" showLabel />
        <div className="lbl">AVISO · FINO</div>
        <ProgressBar value={78} tone="warning" size="sm" />
        <div className="lbl">PERIGO · GRANDE</div>
        <ProgressBar value={32} tone="danger" size="lg" showLabel />
        <div className="lbl">INDETERMINADA</div>
        <ProgressBar tone="primary" indeterminate />
        <div className="lbl">SEGMENTADA</div>
        <ProgressBar segments={5} currentSegment={3} tone="primary" />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
