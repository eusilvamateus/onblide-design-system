<!-- @dsCard group="Components" name="Spinner" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Spinner</title>
<link rel="stylesheet" href="../../package/src/tokens.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .wrap { display: grid; grid-template-columns: 240px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 680px) { .wrap { grid-template-columns: 1fr; } }
  .panel { display: flex; flex-direction: column; gap: 20px; }
  .ctrl { display: flex; flex-direction: column; gap: 9px; }
  .ctrl > .head { font-family: var(--ob-font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ob-fg-mute); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .stage { background: var(--ob-bg-warm); border-radius: var(--ob-r-surface); border: 1.5px dashed var(--ob-border); padding: 32px 28px; display: flex; flex-direction: column; gap: 32px; }
  .row-label { font-family: var(--ob-font-mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ob-fg-mute); margin-bottom: 16px; }
  .flex-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .card-demo { background: var(--ob-surface); border: 1px solid var(--ob-border); border-radius: var(--ob-r-surface); padding: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; color: var(--ob-fg-soft); min-height: 80px; }
  .btn-demo { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: var(--ob-r-control); border: none; background: var(--ob-blue); color: #fff; font-family: var(--ob-font); font-size: 14px; font-weight: 600; cursor: default; }
  .btn-demo.ghost { background: var(--ob-surface); color: var(--ob-fg-strong); border: 1.5px solid var(--ob-border); }
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/thin/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/duotone/style.css">
</head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.Icons=window.Icons||{};</script>
<script src="../../package/dist/onblide-ui.browser.js"></script>
<script type="text/babel">
const { useState } = React;
const TONES = ['default','success','warning','danger','muted'];
const SIZES = ['xs','sm','md','lg','xl'];

function Demo() {
  const [tone, setTone] = useState('default');
  const [size, setSize] = useState('md');
  const [loading, setLoading] = useState(false);

  return (
    <div className="wrap">
      <div className="panel">
        <div className="ctrl">
          <span className="head">Tom</span>
          <div className="chip-row">
            {TONES.map(t => <Chip key={t} label={t} size="sm" selected={tone===t} onToggle={()=>setTone(t)} />)}
          </div>
        </div>
        <div className="ctrl">
          <span className="head">Tamanho</span>
          <div className="chip-row">
            {SIZES.map(s => <Chip key={s} label={s} size="sm" selected={size===s} onToggle={()=>setSize(s)} />)}
          </div>
        </div>
        <div className="ctrl">
          <span className="head">Contexto</span>
          <Toggle checked={loading} onChange={setLoading} label={loading ? 'Loading ativo' : 'Loading inativo'} />
        </div>
      </div>

      <div className="stage">
        <div>
          <p className="row-label">Isolado</p>
          <div className="flex-row">
            <Spinner size={size} tone={tone} />
          </div>
        </div>

        <div>
          <p className="row-label">Todos os tamanhos · tom selecionado</p>
          <div className="flex-row" style={{alignItems:'center'}}>
            {SIZES.map(s => (
              <div key={s} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
                <Spinner size={s} tone={tone} />
                <span style={{fontSize:10,fontFamily:'var(--ob-font-mono)',color:'var(--ob-fg-mute)'}}>{s}</span>
              </div>
            ))}
          </div>
        </div>

        <div>
          <p className="row-label">Em botão</p>
          <div className="flex-row">
            <div className="btn-demo">
              {loading ? <Spinner size="sm" tone="muted" /> : <i className="ph ph-floppy-disk" style={{fontSize:15}}/>}
              {loading ? 'Salvando…' : 'Salvar'}
            </div>
            <div className="btn-demo ghost">
              {loading ? <Spinner size="sm" tone="primary" /> : <i className="ph ph-arrow-clockwise" style={{fontSize:15}}/>}
              {loading ? 'Atualizando…' : 'Atualizar'}
            </div>
          </div>
        </div>

        <div>
          <p className="row-label">Em card (estado de carregamento)</p>
          <div className="card-demo">
            {loading
              ? <><Spinner size="md" tone={tone} /><span>Carregando dados…</span></>
              : <span style={{color:'var(--ob-fg-mute)'}}>Conteúdo carregado — ative o toggle para ver o loading</span>}
          </div>
        </div>

        <div>
          <p className="row-label">Todos os tons · tamanho md</p>
          <div className="flex-row">
            {TONES.map(t => (
              <div key={t} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
                <Spinner size="md" tone={t} />
                <span style={{fontSize:10,fontFamily:'var(--ob-font-mono)',color:'var(--ob-fg-mute)'}}>{t}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
