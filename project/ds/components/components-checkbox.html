<!doctype html>
<!-- @dsCard group="Components" name="Checkbox" subtitle="Select-all com indeterminate + estados" viewport="760x300" -->
<html lang="pt-BR"><head><meta charset="utf-8"><title>Checkbox</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .grid { display: grid; gap: 22px; grid-template-columns: 90px 1fr; align-items: start; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); padding-top: 2px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 32px; flex-wrap: wrap; }
</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../../ui_kits/web_app/Components.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    function Demo() {
      const [items, setItems] = useState({ a: true, b: false, c: true });
      const all = items.a && items.b && items.c;
      const some = (items.a || items.b || items.c) && !all;
      return (
        <div className="grid">
          <div className="lbl">LIST</div>
          <div className="col">
            <Checkbox checked={all} indeterminate={some} onChange={(v) => setItems({ a: v, b: v, c: v })} label="Selecionar tudo" />
            <div style={{ paddingLeft: 28, display: 'flex', flexDirection: 'column', gap: 12 }}>
              <Checkbox checked={items.a} onChange={(v) => setItems(s => ({...s, a: v}))} label="Deploy automático" description="Publica ao fazer merge" />
              <Checkbox checked={items.b} onChange={(v) => setItems(s => ({...s, b: v}))} label="Notificar equipe" />
              <Checkbox checked={items.c} onChange={(v) => setItems(s => ({...s, c: v}))} label="Rodar testes" />
            </div>
          </div>
          <div className="lbl">STATES</div>
          <div className="row">
            <Checkbox checked={true} onChange={()=>{}} label="Marcado" />
            <Checkbox checked={false} onChange={()=>{}} label="Vazio" />
            <Checkbox indeterminate onChange={()=>{}} label="Indeterminado" />
            <Checkbox checked={true} disabled label="Desabilitado" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body></html>
