<!-- @dsCard group="Components" name="Drawer" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Drawer</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--ob-surface); font-family: var(--ob-font); }
  .grid { display: grid; gap: 20px; grid-template-columns: 100px 1fr; align-items: center; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../package/dist/onblide-ui.browser.js"></script>
<script type="text/babel">
const { useState } = React;

/* ── Demo trigger button ── */
const Btn = ({ kind = 'secondary', onClick, children }) => {
  const s = {
    base: { padding: '10px 18px', borderRadius: 'var(--ob-r-control)', border: 'none', cursor: 'pointer', fontFamily: 'var(--ob-font)', fontSize: 14, fontWeight: 600, transition: 'all .12s' },
    primary:   { background: 'var(--ob-blue)',    color: '#fff' },
    secondary: { background: 'var(--ob-surface)', color: 'var(--ob-fg-strong)', border: '1.5px solid var(--ob-border)' },
    danger:    { background: 'var(--ob-danger)',   color: '#fff' },
  };
  return <button style={{ ...s.base, ...s[kind] }} onClick={onClick}>{children}</button>;
};

/* ── Content helpers ── */
const Field = ({ label, placeholder, type = 'text' }) => (
  <div style={{ marginBottom: 16 }}>
    <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--ob-fg-strong)', marginBottom: 6 }}>{label}</div>
    {type === 'textarea'
      ? <textarea placeholder={placeholder} rows={3} style={{ width: '100%', padding: '10px 12px', border: '1.5px solid var(--ob-border)', borderRadius: 8, background: 'var(--ob-surface)', color: 'var(--ob-fg)', fontFamily: 'var(--ob-font)', fontSize: 14, resize: 'vertical', boxSizing: 'border-box' }}/>
      : <input type={type} placeholder={placeholder} style={{ width: '100%', height: 42, padding: '0 12px', border: '1.5px solid var(--ob-border)', borderRadius: 8, background: 'var(--ob-surface)', color: 'var(--ob-fg)', fontFamily: 'var(--ob-font)', fontSize: 14, boxSizing: 'border-box' }}/>
    }
  </div>
);

const TaskRow = ({ title, tag, done }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 0', borderBottom: '1px solid var(--ob-line-soft)' }}>
    <div style={{ width: 18, height: 18, borderRadius: 5, border: done ? 'none' : '1.5px solid var(--ob-border)', background: done ? 'var(--ob-blue)' : 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, color: '#fff', fontSize: 11 }}>{done ? '✓' : ''}</div>
    <span style={{ flex: 1, fontSize: 14, color: done ? 'var(--ob-fg-mute)' : 'var(--ob-fg)', textDecoration: done ? 'line-through' : 'none' }}>{title}</span>
    <span style={{ fontSize: 11, fontWeight: 600, padding: '3px 8px', borderRadius: 999, background: 'var(--ob-blue-100)', color: 'var(--ob-blue)' }}>{tag}</span>
  </div>
);

/* ── Demo ── */
function Demo() {
  const [form,   setForm]   = useState(false);
  const [tasks,  setTasks]  = useState(false);
  const [left,   setLeft]   = useState(false);
  const [filter, setFilter] = useState(false);

  return (
    <div className="grid">

      <div className="lbl">FORMULÁRIO</div>
      <div className="row">
        <Btn onClick={() => setForm(true)}>Novo colaborador</Btn>
      </div>

      <div className="lbl">DETALHE</div>
      <div className="row">
        <Btn onClick={() => setTasks(true)}>Ver tarefas</Btn>
      </div>

      <div className="lbl">FILTROS</div>
      <div className="row">
        <Btn onClick={() => setFilter(true)}>Filtrar resultados</Btn>
      </div>

      <div className="lbl">ESQUERDA</div>
      <div className="row">
        <Btn onClick={() => setLeft(true)}>Painel esquerdo</Btn>
      </div>

      {/* Formulário */}
      <Drawer open={form} onClose={() => setForm(false)} title="Novo colaborador" width={420}
        footer={<>
          <Btn onClick={() => setForm(false)}>Cancelar</Btn>
          <Btn kind="primary" onClick={() => setForm(false)}>Convidar</Btn>
        </>}>
        <Field label="Nome completo" placeholder="Ex: Ana Lima"/>
        <Field label="E-mail" placeholder="ana@empresa.com" type="email"/>
        <Field label="Cargo" placeholder="Ex: Designer de Produto"/>
        <Field label="Observações" placeholder="Informações adicionais…" type="textarea"/>
      </Drawer>

      {/* Detalhe / tarefas */}
      <Drawer open={tasks} onClose={() => setTasks(false)} title="Tarefas do projeto" width={400}
        footer={<Btn kind="primary" onClick={() => setTasks(false)}>Fechar</Btn>}>
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 13, color: 'var(--ob-fg-mute)', marginBottom: 14 }}>Sprint atual · 4 de 7 concluídas</div>
          <div style={{ height: 5, borderRadius: 999, background: 'var(--ob-bg-alt)', marginBottom: 20 }}>
            <div style={{ width: '57%', height: '100%', borderRadius: 999, background: 'var(--ob-blue)' }}/>
          </div>
        </div>
        <TaskRow title="Mapear jornada do usuário" tag="UX" done={true}/>
        <TaskRow title="Wireframes do dashboard" tag="UI" done={true}/>
        <TaskRow title="Auditoria de tipografia" tag="DS" done={true}/>
        <TaskRow title="Protótipo de onboarding" tag="UX" done={true}/>
        <TaskRow title="Componente Select" tag="DS" done={false}/>
        <TaskRow title="Testes de usabilidade" tag="UX" done={false}/>
        <TaskRow title="Revisão com stakeholders" tag="PM" done={false}/>
      </Drawer>

      {/* Filtros */}
      <Drawer open={filter} onClose={() => setFilter(false)} title="Filtrar resultados" width={360}
        footer={<>
          <Btn onClick={() => setFilter(false)}>Limpar filtros</Btn>
          <Btn kind="primary" onClick={() => setFilter(false)}>Aplicar</Btn>
        </>}>
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--ob-fg-strong)', marginBottom: 10 }}>Status</div>
          {['Todos', 'Em progresso', 'Concluído', 'Atrasado'].map((s, i) => (
            <label key={s} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 0', borderBottom: '1px solid var(--ob-line-soft)', cursor: 'pointer' }}>
              <input type="checkbox" defaultChecked={i === 0} style={{ accentColor: 'var(--ob-blue)', width: 16, height: 16 }}/>
              <span style={{ fontSize: 14, color: 'var(--ob-fg)' }}>{s}</span>
            </label>
          ))}
        </div>
        <div>
          <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--ob-fg-strong)', marginBottom: 10 }}>Responsável</div>
          <Field label="" placeholder="Buscar por nome…"/>
        </div>
      </Drawer>

      {/* Esquerda */}
      <Drawer open={left} onClose={() => setLeft(false)} title="Painel esquerdo" side="left" width={320}
        footer={<Btn onClick={() => setLeft(false)}>Fechar</Btn>}>
        <p style={{ fontSize: 14, color: 'var(--ob-fg)', lineHeight: 1.6 }}>
          O Drawer também pode abrir pelo lado esquerdo. Útil para menus de navegação temporários, histórico ou contexto secundário.
        </p>
      </Drawer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
