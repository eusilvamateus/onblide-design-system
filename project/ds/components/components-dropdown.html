<!-- @dsCard group="Components" name="Dropdown" subtitle="Ícones, divisor, perigo, desabilitado + alinhamento" viewport="760x320" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Dropdown</title>
<link rel="stylesheet" href="../../package/src/tokens.css">
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); min-height: 320px; }
  .grid { display: grid; gap: 24px; grid-template-columns: 90px 1fr; align-items: start; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); padding-top: 10px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .trigger { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--ob-border); background: var(--ob-surface); color: var(--ob-fg-strong); font-family: var(--ob-font); font-size: 14px; font-weight: 600; cursor: pointer; }
  .picked { font-size: 13px; color: var(--ob-fg-soft); margin-top: 14px; }
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/thin/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/duotone/style.css">
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../package/dist/onblide-ui.browser.js"></script>
  <script type="text/babel">
    const { useState } = React;
    const Caret = () => <Ph n="caret-down" size={14} />;
    const Dot = () => <Ph n="circle" size={16} />;
    function Demo() {
      const [last, setLast] = useState('—');
      return (
        <div className="grid">
          <div className="lbl">MENU</div>
          <div>
            <div className="row">
              <Dropdown trigger={<button className="trigger">Ações <Caret/></button>} items={[
                { label: 'Editar', icon: <Dot/>, onClick: () => setLast('Editar') },
                { label: 'Duplicar', icon: <Dot/>, onClick: () => setLast('Duplicar') },
                { label: 'Compartilhar', icon: <Dot/>, onClick: () => setLast('Compartilhar') },
                { divider: true },
                { label: 'Excluir', icon: <Dot/>, danger: true, onClick: () => setLast('Excluir') },
              ]} />
              <Dropdown align="right" trigger={<button className="trigger">Alinhado à direita <Caret/></button>} items={[
                { label: 'Renomear', onClick: () => setLast('Renomear') },
                { label: 'Mover', onClick: () => setLast('Mover') },
                { label: 'Arquivar (em breve)', disabled: true },
              ]} />
            </div>
            <div className="picked">Última ação: <strong style={{ color: 'var(--ob-fg-strong)' }}>{last}</strong></div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body></html>
