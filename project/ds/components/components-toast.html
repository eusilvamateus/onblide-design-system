<!-- @dsCard group="Components" name="Toast" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Toast</title>
<link rel="stylesheet" href="../../package/src/tokens.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .wrap { display: grid; grid-template-columns: 1fr; gap: 24px; align-items: start; }
  @media (min-width: 768px) { .wrap { grid-template-columns: 260px 1fr; } }

  .panel { display: flex; flex-direction: column; gap: 22px; }
  .ctrl { display: flex; flex-direction: column; gap: 9px; }
  .ctrl > label.head { font-family: var(--ob-font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ob-fg-mute); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }

  .seg { display: inline-flex; background: var(--ob-bg-alt); border: 1px solid var(--ob-border); border-radius: var(--ob-r-sm); padding: 3px; gap: 3px; }
  .seg button { border: none; background: none; cursor: pointer; font-family: var(--ob-font); font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: var(--ob-r-xs); color: var(--ob-fg-soft); transition: all .12s; }
  .seg button.on { background: var(--ob-surface); color: var(--ob-fg-strong); box-shadow: var(--ob-shadow-xs); }

  .pos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .pos-btn { height: 38px; border-radius: var(--ob-r-control); border: 1.5px solid var(--ob-border); background: var(--ob-surface); color: var(--ob-fg-soft); font-family: var(--ob-font-mono); font-size: 9px; letter-spacing: .03em; text-transform: uppercase; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .pos-btn:hover:not(:disabled) { border-color: var(--ob-blue); color: var(--ob-blue); }
  .pos-btn.on { background: var(--ob-blue); color: #fff; border-color: var(--ob-blue); }
  .pos-btn:disabled { opacity: .35; cursor: not-allowed; }

  .fire { display: flex; gap: 8px; }
  .btn-primary { flex: 1; height: 42px; border: none; border-radius: var(--ob-r-control); background: var(--ob-blue); color: #fff; font-family: var(--ob-font); font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; transition: background .12s; }
  .btn-primary:hover { background: var(--ob-blue-700); }
  .btn-ghost { height: 42px; padding: 0 14px; border: 1.5px solid var(--ob-border); border-radius: var(--ob-r-control); background: var(--ob-surface); color: var(--ob-fg-soft); font-family: var(--ob-font); font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-ghost:hover { border-color: var(--ob-fg-soft); color: var(--ob-fg-strong); }

  /* Stage */
  .stage-wrap { display: flex; flex-direction: column; gap: 10px; }
  .stage-meta { font-size: 12px; color: var(--ob-fg-mute); font-family: var(--ob-font-mono); }
  .stage { position: relative; height: 620px; border: 1.5px dashed var(--ob-border); border-radius: var(--ob-r-surface); background: var(--ob-bg-warm); overflow: hidden; transition: all .2s; }
  .stage.mobile { width: 390px; height: 780px; margin: 0 auto; border-radius: 48px; border: 10px solid var(--ob-fg-strong); background: var(--ob-bg); box-shadow: 0 32px 64px rgba(0,0,0,.18); }
  .stage-app { padding: 18px; display: flex; flex-direction: column; gap: 11px; opacity: .65; pointer-events: none; }
  .stage.mobile .stage-app { padding-top: 30px; }
  .app-bar { height: 44px; border-radius: var(--ob-r-sm); background: var(--ob-surface); border: 1px solid var(--ob-border); }
  .app-card { height: 60px; border-radius: var(--ob-r-surface); background: var(--ob-surface); border: 1px solid var(--ob-border); }
  .app-card-sm { height: 40px; border-radius: var(--ob-r-surface); background: var(--ob-bg-warm); }
  .stage.mobile .app-card-sm { background: var(--ob-bg-alt); }
  .stage-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; font-size: 13px; color: var(--ob-fg-mute); width: 70%; line-height: 1.5; }
  .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 110px; height: 22px; background: var(--ob-fg-strong); border-radius: 0 0 14px 14px; }
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/thin/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/duotone/style.css">
</head>
<body><div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../package/dist/onblide-ui.browser.js"></script>
<script type="text/babel">
  const { useState, useRef, useCallback } = React;

  const COPY = {
    success: { title: 'Tarefa concluída',     body: 'O relatório de maio foi publicado.',     action: 'Ver' },
    info:    { title: 'Sincronizando…',         body: 'Buscando dados do Spotify.',            action: 'Detalhes' },
    warning: { title: 'Cota quase no limite',   body: 'Você usou 90% do plano atual.',         action: 'Fazer upgrade' },
    danger:  { title: 'Falha no deploy',        body: 'Não foi possível subir a build #482.',  action: 'Tentar de novo' },
  };
  const TONES = ['success', 'info', 'warning', 'danger'];
  const POSITIONS = ['top-left','top-center','top-right','bottom-left','bottom-center','bottom-right'];

  function Demo() {
    const [tone, setTone] = useState('success');
    const [content, setContent] = useState('action');  // 'title' | 'body' | 'action'
    const [showIcon, setShowIcon] = useState(true);
    const [position, setPosition] = useState('bottom-right');
    const [viewport, setViewport] = useState('desktop'); // 'desktop' | 'mobile'
    const [stack, setStack] = useState([]);
    const idRef = useRef(0);

    const dismiss = useCallback((id) => {
      setStack(s => s.map(t => t.id === id ? { ...t, leaving: true } : t));
      setTimeout(() => setStack(s => s.filter(t => t.id !== id)), 200);
    }, []);

    const fire = (forcedTone) => {
      const tn = forcedTone || tone;
      const c = COPY[tn];
      const t = { id: ++idRef.current, tone: tn, icon: showIcon, title: c.title };
      if (content !== 'title') t.body = c.body;
      if (content === 'action') t.action = c.action;
      setStack(s => [...s.slice(-2), t]);
      setTimeout(() => dismiss(t.id), 4500);
    };

    const isMobile = viewport === 'mobile';
    const isTop = position.startsWith('top');
    const animIn  = isTop ? 'ob-toast-in-top'  : 'ob-toast-in-bottom';
    const animOut = isTop ? 'ob-toast-out-top' : 'ob-toast-out-bottom';

    // Stage anchoring mirrors the real ToastStack (desktop: 6 anchors; mobile: full-width, keep top/bottom)
    const anchor = () => {
      const edge = isTop ? { top: isMobile ? 14 : 14 } : { bottom: 14 };
      if (isMobile) return { ...edge, left: 12, right: 12, alignItems: 'stretch' };
      const h = position.endsWith('left') ? { left: 14, alignItems: 'flex-start' }
              : position.endsWith('right') ? { right: 14, alignItems: 'flex-end' }
              : { left: '50%', transform: 'translateX(-50%)', alignItems: 'center' };
      return { ...edge, ...h };
    };

    return (
      <div className="wrap">

        {/* ── Controls ── */}
        <div className="panel">
          <div className="ctrl">
            <label className="head">Tom</label>
            <div className="chip-row">
              {TONES.map(tn => (
                <Chip key={tn} label={tn} size="sm" selected={tone === tn} onToggle={() => setTone(tn)} />
              ))}
            </div>
          </div>

          <div className="ctrl">
            <label className="head">Conteúdo</label>
            <RadioGroup
              name="content"
              value={content}
              onChange={setContent}
              options={[
                { value: 'title',  label: 'Só título' },
                { value: 'body',   label: 'Título + corpo' },
                { value: 'action', label: 'Título + corpo + ação' },
              ]}
            />
          </div>

          <div className="ctrl">
            <label className="head">Ícone</label>
            <Toggle checked={showIcon} onChange={setShowIcon} label={showIcon ? 'Com chip de ícone' : 'Sem ícone'} />
          </div>

          <div className="ctrl">
            <label className="head">Viewport</label>
            <div className="seg">
              <button className={!isMobile ? 'on' : ''} onClick={() => setViewport('desktop')}>Desktop</button>
              <button className={isMobile ? 'on' : ''} onClick={() => {
                setViewport('mobile');
                if (!position.endsWith('center')) setPosition(isTop ? 'top-center' : 'bottom-center');
              }}>Mobile</button>
            </div>
          </div>

          <div className="ctrl">
            <label className="head">Posição {isMobile && '· mobile usa full-width'}</label>
            <div className="pos-grid">
              {POSITIONS.map(p => {
                const horizontalLocked = isMobile && !p.endsWith('center');
                return (
                  <button key={p}
                    className={'pos-btn' + (p === position ? ' on' : '')}
                    disabled={horizontalLocked}
                    title={horizontalLocked ? 'No mobile o toast é full-width — use top/bottom center' : ''}
                    onClick={() => setPosition(p)}>
                    {p === position && <i className="ph ph-check" style={{fontSize:10}}/>}
                    {p.replace('-', ' ')}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="fire">
            <button className="btn-primary" onClick={() => fire()}>
              <i className="ph ph-bell-ringing" style={{fontSize:16}}/>Disparar toast
            </button>
            <button className="btn-ghost" onClick={() => setStack([])}>Limpar</button>
          </div>
        </div>

        {/* ── Live stage ── */}
        <div className="stage-wrap">
          <div className="stage-meta">{isMobile ? 'MOBILE' : 'DESKTOP'} · {position.replace('-',' ')} · {stack.length} ativo(s)</div>
          <div className={'stage' + (isMobile ? ' mobile' : '')}>
            {isMobile && <div className="notch"/>}
            <div className="stage-app">
              <div className="app-bar"/>
              <div className="app-card"/>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <div className="app-card-sm"/><div className="app-card-sm"/>
              </div>
              <div className="app-card"/>
              {!isMobile && <div className="app-card-sm"/>}
            </div>

            {stack.length === 0 && (
              <div className="stage-hint">Configure ao lado e <strong>dispare</strong> — o toast aparece aqui, anima, empilha e some.</div>
            )}

            <div style={{
              position: 'absolute', display: 'flex', gap: 10,
              flexDirection: isTop ? 'column-reverse' : 'column',
              width: isMobile ? 'auto' : 'min(360px, calc(100% - 28px))',
              ...anchor(),
            }}>
              {stack.map(t => (
                <div key={t.id} style={{ width: '100%', animation: `${t.leaving ? animOut : animIn} 0.2s cubic-bezier(0.16,1,0.3,1) both` }}>
                  <Toast {...t} onClose={() => dismiss(t.id)} />
                </div>
              ))}
            </div>
          </div>
        </div>

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
