<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Toast</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .grid { display: grid; gap: 22px; grid-template-columns: 100px 1fr; align-items: start; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); padding-top: 14px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--ob-border); background: var(--ob-surface); color: var(--ob-fg); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--ob-blue); color: var(--ob-blue); }
  .muted { font-size: 12px; color: var(--ob-fg-mute); }
</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.Icons = window.Icons || {};</script>
<script type="text/babel" src="../../ui_kits/web_app/Components.jsx"></script>
<script type="text/babel">
  const { useState, useRef } = React;
  const PRESETS = {
    success: { title: 'Tarefa concluída', body: 'O relatório de maio foi publicado.', action: 'Ver' },
    info:    { title: 'Sincronizando…',   body: 'Buscando atualizações do Spotify.' },
    warning: { title: 'Cota quase no limite', body: 'Você usou 90% do plano atual.' },
    danger:  { title: 'Falha no deploy', body: 'Não foi possível subir a build #482.', action: 'Tentar de novo' },
  };
  function Demo() {
    const [stack, setStack] = useState([]);
    const id = useRef(0);
    const push = (tone) => {
      const n = ++id.current;
      setStack(s => [...s, { id: n, tone, ...PRESETS[tone] }]);
      setTimeout(() => setStack(s => s.filter(t => t.id !== n)), 4500);
    };
    return (
      <div className="grid">
        <div className="lbl">4 TONS</div>
        <div className="col">
          <Toast tone="success" title="Tarefa concluída" body="O relatório de maio foi publicado." action="Ver" onClose={()=>{}} />
          <Toast tone="info"    title="Sincronizando…"   body="Buscando atualizações do Spotify." onClose={()=>{}} />
          <Toast tone="warning" title="Cota quase no limite" body="Você usou 90% do plano atual." onClose={()=>{}} />
          <Toast tone="danger"  title="Falha no deploy" body="Não foi possível subir a build #482." action="Tentar de novo" onClose={()=>{}} />
        </div>
        <div className="lbl">AO VIVO</div>
        <div>
          <div className="row" style={{marginBottom:14}}>
            {['success','info','warning','danger'].map(t => <button key={t} className="btn" onClick={()=>push(t)}>{t}</button>)}
            <span className="muted">Dispare — somem em ~4,5 s.</span>
          </div>
          <div className="col">{stack.map(t => <Toast key={t.id} {...t} onClose={()=>setStack(s=>s.filter(x=>x.id!==t.id))} />)}</div>
          {stack.length===0 && <p className="muted">Nenhum toast ativo.</p>}
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
