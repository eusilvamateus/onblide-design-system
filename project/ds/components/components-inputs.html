<!doctype html>
<!-- @dsCard group="Components" name="Inputs & toggles" subtitle="Default, foco, erro, desabilitado" viewport="760x240" -->
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../../package/src/tokens.css">
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); color: var(--ob-fg); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-size: 12px; font-weight: 600; color: var(--ob-fg-strong); }
  .input { width: 100%; padding: 10px 14px; border-radius: var(--ob-r-control); border: 1.5px solid var(--ob-border); font-family: inherit; font-size: 14px; color: var(--ob-fg-strong); background: var(--ob-surface); box-sizing: border-box; transition: border-color 160ms; }
  .input:focus { outline: none; border-color: var(--ob-blue); box-shadow: 0 0 0 4px var(--ob-focus-ring); }
  .input.error { border-color: var(--ob-danger); }
  .input:disabled { background: var(--ob-bg-alt); color: var(--ob-fg-mute); cursor: not-allowed; }
  .help { font-size: 11px; color: var(--ob-fg-mute); }
  .help.error { color: var(--ob-danger); }
</style></head><body>
  <div class="grid">
    <div class="field">
      <span class="lbl">Nome</span>
      <input class="input" value="Onblide" />
      <span class="help">Mostrado no seu perfil.</span>
    </div>
    <div class="field">
      <span class="lbl">E-mail</span>
      <input class="input error" value="invalid@" />
      <span class="help error">Formato inválido.</span>
    </div>
    <div class="field">
      <span class="lbl">Foco</span>
      <input class="input" value="Em foco — borda azul" autofocus style="border-color:var(--ob-blue); box-shadow: 0 0 0 4px var(--ob-focus-ring);" />
    </div>
    <div class="field">
      <span class="lbl">Desabilitado</span>
      <input class="input" value="Não editável" disabled />
      <span class="help">Campo bloqueado.</span>
    </div>
  </div>
</body></html>
