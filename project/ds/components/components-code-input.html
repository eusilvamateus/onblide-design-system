<!doctype html>
<!-- @dsCard group="Components" name="Code Input" -->
<html lang="pt-BR"><head><meta charset="utf-8"><title>Code Input</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .grid { display: grid; gap: 28px; grid-template-columns: 100px 1fr; align-items: center; }
  .lbl { font-family: var(--ob-font-mono); font-size: 11px; color: var(--ob-fg-mute); }
  .row { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--ob-fg-soft); margin-top: 10px; display: flex; align-items: center; gap: 6px; }
  .hint.err { color: var(--ob-danger); }
</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../package/dist/onblide-ui.browser.js"></script>
<script type="text/babel">
  const { useState } = React;
  function Demo() {
    const [v6, setV6] = useState('');
    const status6 = v6.length === 6 ? 'success' : 'default';
    return (
      <div className="grid">
        <div className="lbl">6 DÍGITOS</div>
        <div>
          <CodeInput length={6} value={v6} onChange={setV6} status={status6} />
          <p className="hint">Digite, cole o código ou navegue com ←/→ e Backspace.</p>
        </div>
        <div className="lbl">4 DÍGITOS</div>
        <CodeInput length={4} value="428" onChange={()=>{}} />
        <div className="lbl">SUCESSO</div>
        <CodeInput length={6} value="847291" onChange={()=>{}} status="success" />
        <div className="lbl">ERRO</div>
        <div>
          <CodeInput length={6} value="903124" onChange={()=>{}} status="error" />
          <p className="hint err"><i className="ph ph-warning-circle" style={{fontSize:14}}/>Código incorreto ou expirado.</p>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
