<!-- @dsCard group="Components" name="Status dot" subtitle="Indicador semântico compacto para estados" -->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Status dot</title>
    <link rel="stylesheet" href="../../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: var(--ob-surface);
        font-family: var(--ob-font);
      }

      .section {
        margin-bottom: 28px;
      }

      .row-label {
        margin-bottom: 12px;
        color: var(--ob-fg-mute);
        font-family: var(--ob-font-mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 18px;
      }

      .sample {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--ob-fg);
        font-size: 14px;
      }

      .filter {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 36px;
        padding: 0 14px;
        border: 0;
        border-bottom: 2px solid var(--ob-blue);
        background: transparent;
        color: var(--ob-fg-strong);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script src="../../package/dist/onblide-ui.browser.js"></script>
    <script type="text/babel">
      const TONES = [
        { tone: "blue", label: "Em foco" },
        { tone: "green", label: "Concluído" },
        { tone: "orange", label: "Pendente" },
        { tone: "red", label: "Erro" },
        { tone: "grey", label: "Rascunho" },
      ];

      function Demo() {
        return (
          <div>
            <section className="section">
              <div className="row-label">Tons semânticos</div>
              <div className="row">
                {TONES.map((item) => (
                  <span className="sample" key={item.tone}>
                    <StatusDot tone={item.tone} />
                    {item.label}
                  </span>
                ))}
              </div>
            </section>
            <section>
              <div className="row-label">Em um filtro</div>
              <button className="filter" type="button">
                <StatusDot tone="orange" />
                Pendente
              </button>
            </section>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
