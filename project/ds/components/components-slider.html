<!-- @dsCard group="Components" name="Slider" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Slider</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--ob-surface); font-family: var(--ob-font); }
  .wrap { display: grid; grid-template-columns: 260px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } }

  .panel { display: flex; flex-direction: column; gap: 20px; }
  .ctrl { display: flex; flex-direction: column; gap: 9px; }
  .ctrl > label.head { font-family: var(--ob-font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ob-fg-mute); }

  .seg { display: inline-flex; background: var(--ob-bg-alt); border: 1px solid var(--ob-border); border-radius: var(--ob-r-sm); padding: 3px; gap: 3px; }
  .seg button { border: none; background: none; cursor: pointer; font-family: var(--ob-font); font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: var(--ob-r-xs); color: var(--ob-fg-soft); transition: all .12s; }
  .seg button.on { background: var(--ob-surface); color: var(--ob-fg-strong); box-shadow: var(--ob-shadow-xs); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }

  .stage { background: var(--ob-bg-warm); border-radius: var(--ob-r-surface); border: 1.5px dashed var(--ob-border); padding: 32px; display: flex; flex-direction: column; gap: 36px; }
  .stage-label { font-family: var(--ob-font-mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ob-fg-mute); margin-bottom: 14px; }

  .field-row { display: flex; align-items: center; gap: 14px; }
  .field-row .key { font-size: 13px; color: var(--ob-fg-soft); white-space: nowrap; min-width: 100px; }
  .field-row > div:last-child { flex: 1; }
</style></head>
<body><div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../package/dist/onblide-ui.browser.js"></script>
<script type="text/babel">
  const { useState } = React;

  const TONES = ['default','success','warning','danger'];

  function Demo() {
    const [mode,     setMode]     = useState('single');   // 'single' | 'range'
    const [tone,     setTone]     = useState('default');
    const [marks,    setMarks]    = useState(false);
    const [showVal,  setShowVal]  = useState(true);
    const [disabled, setDisabled] = useState(false);
    const [error,    setError]    = useState(false);
    const [step,     setStep]     = useState(1);

    // Single
    const [val,  setVal]  = useState(40);
    const [val2, setVal2] = useState(60);
    // Range
    const [rng,  setRng]  = useState([20, 70]);
    const [rng2, setRng2] = useState([30, 80]);
    // Fine step
    const [fine, setFine] = useState(2.5);

    const isRange = mode === 'range';

    return (
      <div className="wrap">
        {/* Controls */}
        <div className="panel">
          <div className="ctrl">
            <label className="head">Modo</label>
            <div className="seg">
              {['single','range'].map(m => (
                <button key={m} className={mode===m?'on':''} onClick={()=>setMode(m)}>{m}</button>
              ))}
            </div>
          </div>

          <div className="ctrl">
            <label className="head">Tom</label>
            <div className="chip-row">
              {TONES.map(t => <Chip key={t} label={t} size="sm" selected={tone===t} onToggle={()=>setTone(t)} />)}
            </div>
          </div>

          <div className="ctrl">
            <label className="head">Step</label>
            <div className="seg">
              {[1,5,10,0.5].map(s => (
                <button key={s} className={step===s?'on':''} onClick={()=>setStep(s)}>{s}</button>
              ))}
            </div>
          </div>

          <div className="ctrl">
            <label className="head">Opções</label>
            <Toggle checked={marks}    onChange={setMarks}    label="Marcas (marks)" />
            <Toggle checked={showVal}  onChange={setShowVal}  label="Exibir valor" />
            <Toggle checked={disabled} onChange={setDisabled} label="Desabilitado" />
            <Toggle checked={error}    onChange={setError}    label="Estado de erro" />
          </div>
        </div>

        {/* Live stage */}
        <div className="stage">
          <div>
            <p className="stage-label">Sem rótulo</p>
            <Slider
              value={isRange ? rng : val} min={0} max={100} step={step}
              onChange={isRange ? setRng : setVal}
              tone={tone} marks={marks} showValue={showVal}
              disabled={disabled} error={error ? 'Valor fora do intervalo permitido' : undefined}
              range={isRange}
            />
          </div>
          <div>
            <p className="stage-label">Com rótulo</p>
            <Slider
              value={isRange ? rng2 : val2} min={0} max={100} step={step}
              onChange={isRange ? setRng2 : setVal2}
              label={isRange ? 'Intervalo de datas' : 'Volume'}
              hint="Arraste ou use as teclas de seta"
              tone={tone} marks={marks} showValue={showVal}
              disabled={disabled} error={error ? 'Valor fora do intervalo permitido' : undefined}
              range={isRange}
            />
          </div>
          <div>
            <p className="stage-label">Passo fracionado (0.5) · 0–10</p>
            <Slider
              value={fine} min={0} max={10} step={0.5}
              onChange={setFine}
              label="Opacidade" hint="Valores de 0 a 10 em passos de 0,5"
              tone={tone} marks showValue
              disabled={disabled}
            />
          </div>
          <div>
            <p className="stage-label">Uso em formulário</p>
            <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
              <Input label="Nome do projeto" placeholder="Ex: Campanha de verão" />
              <Slider
                value={val} min={0} max={100} step={1}
                onChange={setVal} label="Prioridade" showValue
                tone={val >= 80 ? 'danger' : val >= 50 ? 'warning' : 'success'}
                disabled={disabled}
              />
              <Button kind="primary">Salvar</Button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
