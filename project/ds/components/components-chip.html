<!-- @dsCard group="Components" name="Chip" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Chip</title>
<link rel="stylesheet" href="../../package/src/tokens.css">
<style>
  body { margin: 0; padding: 32px; background: var(--ob-surface); font-family: var(--ob-font); }
  .row-label { font-family: var(--ob-font-mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ob-fg-mute); margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 24px; }
  .divider { height: 1px; background: var(--ob-border); margin: 8px 0 24px; }
  .ctx-box { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--ob-bg-alt); border: 1px solid var(--ob-border); border-radius: var(--ob-r-md); }
  .ctx-label { font-size: 13px; font-weight: 600; color: var(--ob-fg-strong); margin-bottom: 8px; }
  .input-mock { width: 100%; padding: '10px 12px'; border: '1px solid var(--ob-border)'; border-radius: 8; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/thin/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/duotone/style.css">
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../package/dist/onblide-ui.browser.js"></script>
<script type="text/babel">
const { useState } = React;

function Demo() {
  const [filter, setFilter] = useState('all');
  const [multiFilter, setMultiFilter] = useState(['ux']);
  const [tags, setTags] = useState(['Design', 'UX Research', 'Protótipo', 'Componentes']);
  const [smSel, setSmSel] = useState('mensal');

  const toggleMulti = (id) => setMultiFilter(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]);
  const removeTag = (t) => setTags(ts => ts.filter(x => x !== t));

  const filterOpts = [
    { id: 'all',   label: 'Tudo' },
    { id: 'doing', label: 'Em andamento' },
    { id: 'done',  label: 'Concluído' },
    { id: 'late',  label: 'Atrasado' },
  ];
  const multiOpts = [
    { id: 'ux',     label: 'UX',      icon: 'user' },
    { id: 'dev',    label: 'Dev',     icon: 'code' },
    { id: 'design', label: 'Design',  icon: 'pen-nib' },
    { id: 'pm',     label: 'PM',      icon: 'briefcase' },
  ];
  const smOpts = ['mensal', 'semanal', 'diário'];

  return (
    <div>
      {/* Toggle simples — single select */}
      <div className="row-label">Single select · filtros de status</div>
      <div className="row">
        {filterOpts.map(o => (
          <Chip key={o.id} label={o.label} selected={filter === o.id} onToggle={() => setFilter(o.id)}/>
        ))}
      </div>

      {/* Toggle múltiplo */}
      <div className="row-label">Multi select · com ícones</div>
      <div className="row">
        {multiOpts.map(o => (
          <Chip key={o.id} label={o.label} icon={o.icon} selected={multiFilter.includes(o.id)} onToggle={() => toggleMulti(o.id)}/>
        ))}
      </div>

      <div className="divider"/>

      {/* Removível — tags */}
      <div className="row-label">Removível · tags de projeto</div>
      <div className="row">
        {tags.map(t => (
          <Chip key={t} label={t} removable onRemove={() => removeTag(t)}/>
        ))}
        {tags.length === 0 && <span style={{ fontSize: 13, color: 'var(--ob-fg-mute)' }}>Todas as tags removidas.</span>}
      </div>

      {/* Removível selecionado */}
      <div className="row-label">Removível · selecionado</div>
      <div className="row">
        <Chip label="Design System" selected removable onRemove={() => {}}/>
        <Chip label="Q3 2026" selected removable onRemove={() => {}}/>
        <Chip label="Alta prioridade" removable onRemove={() => {}}/>
      </div>

      <div className="divider"/>

      {/* SM */}
      <div className="row-label">Tamanho sm</div>
      <div className="row">
        {smOpts.map(o => (
          <Chip key={o} label={o} size="sm" selected={smSel === o} onToggle={() => setSmSel(o)}/>
        ))}
      </div>

      {/* Desabilitado */}
      <div className="row-label">Desabilitado</div>
      <div className="row">
        <Chip label="Disponível" selected onToggle={() => {}}/>
        <Chip label="Desabilitado" disabled onToggle={() => {}}/>
        <Chip label="Desabilitado selecionado" selected disabled onToggle={() => {}}/>
      </div>

      <div className="divider"/>

      {/* Em contexto */}
      <div className="row-label">Em contexto · campo de tags</div>
      <div className="ctx-box">
        <div>
          <div className="ctx-label">Tags do projeto</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, padding: '10px 12px', border: '1px solid var(--ob-border)', borderRadius: 10, background: 'var(--ob-surface)', minHeight: 44, alignItems: 'center' }}>
            <Chip label="Design" selected removable size="sm" onRemove={() => {}}/>
            <Chip label="UX" selected removable size="sm" onRemove={() => {}}/>
            <Chip label="Q3 2026" selected removable size="sm" onRemove={() => {}}/>
            <input placeholder="Adicionar tag…" style={{ border: 'none', outline: 'none', fontSize: 13, color: 'var(--ob-fg)', background: 'transparent', flex: 1, minWidth: 100 }}/>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
